name: Cleanup repository history

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 8 * * *'
  workflow_run:
    workflows:
      - Deploy to VPS
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  deployments: write

concurrency:
  group: cleanup-repository-history
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete only branches already integrated into main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          while IFS= read -r ref; do
            branch="${ref#origin/}"
            [[ "$branch" == "main" || "$branch" == "HEAD" ]] && continue

            open_prs=$(gh pr list --state open --head "$branch" --limit 100 --json number --jq 'length')
            if [[ "$open_prs" != "0" ]]; then
              echo "KEEP (open PR): $branch"
              continue
            fi

            safe=false
            if git merge-base --is-ancestor "$ref" origin/main 2>/dev/null; then
              safe=true
              echo "MERGED BY ANCESTRY: $branch"
            elif git diff --quiet "$ref" origin/main; then
              safe=true
              echo "IDENTICAL TREE: $branch"
            else
              tip=$(git rev-parse "$ref")
              if gh pr list --state merged --head "$branch" --limit 100 --json headRefOid --jq '.[].headRefOid' | grep -Fxq "$tip"; then
                safe=true
                echo "MERGED PR TIP: $branch"
              fi
            fi

            if [[ "$safe" != "true" ]]; then
              echo "KEEP (unique/unverified commits): $branch"
              continue
            fi

            echo "DELETE: $branch"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/)

      - name: Keep only the newest GitHub deployment record
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Vercel creates the new GitHub deployment record shortly after the push.
          # Give it a moment so this run can preserve the current release and remove
          # the superseded deployment history shown in the repository sidebar.
          sleep 30

          deployments=$(gh api --paginate "repos/$GITHUB_REPOSITORY/deployments?per_page=100" --jq '.[] | [.id, .sha, .created_at] | @tsv')
          [[ -z "$deployments" ]] && exit 0

          keep_id=$(printf '%s\n' "$deployments" | awk -F '\t' -v sha="$GITHUB_SHA" '$2 == sha { print }' | sort -t $'\t' -k3,3r | head -n1 | cut -f1)
          if [[ -z "$keep_id" ]]; then
            keep_id=$(printf '%s\n' "$deployments" | sort -t $'\t' -k3,3r | head -n1 | cut -f1)
          fi

          echo "KEEP deployment: $keep_id"
          while IFS=$'\t' read -r id sha created_at; do
            [[ -z "$id" || "$id" == "$keep_id" ]] && continue
            echo "REMOVE deployment: $id ($sha, $created_at)"

            # GitHub only permits deletion of inactive deployments when more than
            # one record exists. Mark the superseded record inactive first.
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
              -f state=inactive \
              -f description='Superseded by current release' >/dev/null 2>&1 || true

            gh api --method DELETE "repos/$GITHUB_REPOSITORY/deployments/$id" || \
              echo "WARN: could not delete deployment $id"
          done <<< "$deployments"
